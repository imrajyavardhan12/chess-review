[project]
name = "chessreview"
version = "0.1.0"
description = "Open-source, local-first chess game review with accuracy scores"
requires-python = ">=3.10"
dependencies = ["python-chess>=1.11", "requests>=2.31", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
chessreview = "chessreview.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
